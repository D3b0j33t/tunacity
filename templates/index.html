<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tunacity - Music Recognition</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Roboto:wght@400;500;700&display=swap');

        :root {
            --primary: #00ffcc;
            --background: #0d0d1f;
            --card-bg: rgba(0, 0, 0, 0.9);
            --text: #ffffff;
            --youtube: #ff0000;
            --spotify: #1DB954;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Roboto', sans-serif;
            background: radial-gradient(circle at 50% 50%, #1e1e2f, #0d0d1f);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow-x: hidden;
            padding: 20px;
        }

        .container {
            background: var(--card-bg);
            backdrop-filter: blur(12px);
            border-radius: 15px;
            box-shadow: 0px 0px 40px rgba(0, 0, 0, 0.8);
            padding: 30px 20px;
            width: 100%;
            max-width: 600px;
            text-align: center;
            animation: fadeInUp 1.5s ease-out;
        }

        .header {
            margin-bottom: 20px;
        }

        .title {
            font-family: 'Orbitron', sans-serif;
            font-size: 3rem;
            color: var(--primary);
            text-shadow: 0 0 10px var(--primary), 0 0 20px var(--primary), 0 0 30px var(--primary);
            animation: flicker 2s infinite alternate;
        }

        .visualizer {
            height: 100px;
            margin-bottom: 30px;
            background: linear-gradient(45deg, #00ff99, #003399);
            border-radius: 10px;
            box-shadow: 0px 0px 20px rgba(0, 255, 153, 0.5), 0px 0px 40px rgba(0, 51, 153, 0.5);
            position: relative;
            overflow: hidden;
        }

        #visualizerCanvas {
            width: 100%;
            height: 100%;
            border-radius: 10px;
        }

        .controls {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-bottom: 20px;
        }

        .btn {
            width: 70px;
            height: 70px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
            border: none;
            cursor: pointer;
            font-size: 1.5rem;
            transition: all 0.3s ease;
        }

        .record-btn {
            background: linear-gradient(135deg, #292929, #1e1e1e);
            color: var(--primary);
        }
        
        .record-btn.active {
            background: linear-gradient(135deg, #ff3333, #cc0000);
            color: white;
        }
        
        .record-btn:hover:not(:disabled) {
            transform: scale(1.1);
            box-shadow: 0 0 15px rgba(0, 204, 122, 0.8);
        }
        
        .record-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .download-btn {
            background: linear-gradient(135deg, #292929, #1e1e1e);
            color: #ffcc00;
        }
        
        .download-btn:hover {
            transform: scale(1.1);
            box-shadow: 0 0 15px rgba(255, 204, 0, 0.8);
        }

        .youtube-btn {
            background: linear-gradient(135deg, #292929, #1e1e1e);
            color: var(--youtube);
        }
        
        .youtube-btn:hover {
            transform: scale(1.1);
            box-shadow: 0 0 15px rgba(255, 0, 0, 0.8);
        }

        .status {
            font-size: 1.2rem;
            color: var(--primary);
            margin: 15px 0;
            min-height: 30px;
        }

        .song-info {
            margin-top: 20px;
            background: rgba(32, 32, 32, 0.9);
            padding: 15px;
            border-radius: 10px;
            box-shadow: 0px 0px 20px rgba(0, 0, 0, 0.6);
        }

        .song-info h3 {
            color: var(--primary);
            margin-bottom: 10px;
        }

        .song-details {
            display: grid;
            gap: 10px;
            margin-top: 15px;
        }

        .song-detail {
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .detail-label {
            font-size: 0.8rem;
            color: #aaa;
        }

        .detail-value {
            font-size: 1.2rem;
            font-weight: bold;
        }

        .action-buttons {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-top: 15px;
        }

        .service-btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            color: white;
            font-weight: bold;
            padding: 10px 20px;
            border-radius: 30px;
            text-decoration: none;
            transition: all 0.3s ease;
            cursor: pointer;
        }
        
        .spotify-btn {
            background-color: var(--spotify);
        }
        
        .spotify-btn:hover {
            background-color: #1ed760;
            transform: translateY(-2px);
        }
        
        .youtube-link {
            background-color: var(--youtube);
        }
        
        .youtube-link:hover {
            background-color: #ff3333;
            transform: translateY(-2px);
        }

        .loader {
            display: inline-block;
            width: 30px;
            height: 30px;
            border: 4px solid rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            border-top-color: var(--primary);
            animation: spin 1s ease-in-out infinite;
        }

        .footer {
            margin-top: 30px;
            font-size: 0.8rem;
            color: #888;
        }

        @keyframes fadeInUp {
            from { transform: translateY(50px); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }

        @keyframes flicker {
            0%, 19%, 21%, 23%, 25%, 54%, 56%, 100% { opacity: 1; }
            20%, 22%, 24%, 55% { opacity: 0.5; }
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* Make the UI responsive */
        @media (max-width: 480px) {
            .container {
                padding: 20px 15px;
            }
            
            .title {
                font-size: 2.5rem;
            }
            
            .btn {
                width: 60px;
                height: 60px;
            }
            
            .action-buttons {
                flex-direction: column;
                gap: 10px;
            }
            
            .service-btn {
                width: 100%;
            }
        }

        .download-mp3-btn {
            background-color: #ffcc00;
            color: #000;
            font-weight: bold;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 12px 24px;
            border-radius: 30px;
            text-decoration: none;
            transition: all 0.3s ease;
            cursor: pointer;
        }
        
        .download-mp3-btn:hover {
            background-color: #ffd700;
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(255, 204, 0, 0.3);
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1 class="title">Tunacity</h1>
        </div>
        
        <div class="visualizer">
            <canvas id="visualizerCanvas" width="600" height="100"></canvas>
        </div>
        
        <div class="controls">
            <button id="recordBtn" class="btn record-btn">
                <i class="fas fa-microphone"></i>
            </button>
            
            <button id="downloadBtn" class="btn download-btn" style="display: none;">
                <i class="fas fa-download"></i>
            </button>
            
            <button id="youtubeBtn" class="btn youtube-btn" style="display: none;">
                <i class="fab fa-youtube"></i>
            </button>
        </div>
        
        <div id="status" class="status">Ready to identify music</div>
        
        <div id="loadingIndicator" style="display: none;">
            <div class="loader"></div>
            <p>Processing your audio...</p>
        </div>
        
        <div id="songInfoContainer" class="song-info" style="display: none;">
            <h3>Recognized Song</h3>
            <div class="song-details">
                <div class="song-detail">
                    <span class="detail-label">Title</span>
                    <span id="songTitle" class="detail-value"></span>
                </div>
                
                <div class="song-detail">
                    <span class="detail-label">Artist</span>
                    <span id="songArtist" class="detail-value"></span>
                </div>
            </div>
            
            <div id="songActions" class="action-buttons">
                <a id="spotifyLink" class="service-btn spotify-btn" target="_blank" rel="noopener noreferrer">
                    <i class="fab fa-spotify"></i> Play on Spotify
                </a>
                <a id="youtubeLink" class="service-btn youtube-link" target="_blank" rel="noopener noreferrer">
                    <i class="fab fa-youtube"></i> Watch on YouTube
                </a>
            </div>
        </div>
        
        <div class="footer">
            Made with ❤️ by Debojeet Bhowmick
        </div>
    </div>

    <script>
        // Audio recording and visualization variables
        let mediaRecorder;
        let audioChunks = [];
        let audioContext;
        let analyser;
        let isRecording = false;
        let isProcessing = false;
        let animationId;
        let recognizedSong = null;
        let youtubeVideoId = null;
        
        // DOM Elements
        const recordBtn = document.getElementById('recordBtn');
        const downloadBtn = document.getElementById('downloadBtn');
        const youtubeBtn = document.getElementById('youtubeBtn');
        const statusDisplay = document.getElementById('status');
        const loadingIndicator = document.getElementById('loadingIndicator');
        const songInfoContainer = document.getElementById('songInfoContainer');
        const songTitleElement = document.getElementById('songTitle');
        const songArtistElement = document.getElementById('songArtist');
        const spotifyLink = document.getElementById('spotifyLink');
        const youtubeLink = document.getElementById('youtubeLink');
        const canvas = document.getElementById('visualizerCanvas');
        const canvasCtx = canvas.getContext('2d');
        
        // Setup visualizer idle animation
        function drawIdleVisualizer() {
            const WIDTH = canvas.width;
            const HEIGHT = canvas.height;
            
            canvasCtx.fillStyle = 'rgb(0, 0, 0)';
            canvasCtx.fillRect(0, 0, WIDTH, HEIGHT);
            
            const time = Date.now() / 1000;
            canvasCtx.lineWidth = 2;
            canvasCtx.strokeStyle = 'rgba(0, 255, 153, 0.5)';
            
            canvasCtx.beginPath();
            for (let i = 0; i < WIDTH; i++) {
                const y = HEIGHT / 2 + Math.sin(i * 0.02 + time) * 20;
                if (i === 0) {
                    canvasCtx.moveTo(i, y);
                } else {
                    canvasCtx.lineTo(i, y);
                }
            }
            canvasCtx.stroke();
            
            animationId = requestAnimationFrame(drawIdleVisualizer);
        }
        
        // Draw live audio visualization
        function drawLiveVisualizer(analyser, dataArray) {
            const WIDTH = canvas.width;
            const HEIGHT = canvas.height;
            const bufferLength = analyser.frequencyBinCount;
            
            canvasCtx.fillStyle = 'rgb(0, 0, 0)';
            canvasCtx.fillRect(0, 0, WIDTH, HEIGHT);
            
            canvasCtx.lineWidth = 2;
            canvasCtx.strokeStyle = 'rgb(0, 255, 153)';
            canvasCtx.beginPath();
            
            const sliceWidth = WIDTH / bufferLength;
            let x = 0;
            
            analyser.getByteTimeDomainData(dataArray);
            
            for (let i = 0; i < bufferLength; i++) {
                const v = dataArray[i] / 128.0;
                const y = v * (HEIGHT / 2);
                
                if (i === 0) {
                    canvasCtx.moveTo(x, y);
                } else {
                    canvasCtx.lineTo(x, y);
                }
                
                x += sliceWidth;
            }
            
            canvasCtx.lineTo(WIDTH, HEIGHT / 2);
            canvasCtx.stroke();
            
            if (isRecording) {
                animationId = requestAnimationFrame(() => drawLiveVisualizer(analyser, dataArray));
            }
        }
        
        // Start the idle visualizer
        drawIdleVisualizer();
        
        // Audio recording functions
        async function startRecording() {
            if (isRecording || isProcessing) return;
            
            try {
                // Reset UI
                recognizedSong = null;
                youtubeVideoId = null;
                songInfoContainer.style.display = 'none';
                downloadBtn.style.display = 'none';
                youtubeBtn.style.display = 'none';
                
                const stream = await navigator.mediaDevices.getUserMedia({ 
                    audio: {
                        echoCancellation: true,
                        noiseSuppression: true,
                        sampleRate: 44100
                    }
                });
                
                // Set up audio context and analyzer
                audioContext = new (window.AudioContext || window.webkitAudioContext)();
                analyser = audioContext.createAnalyser();
                analyser.fftSize = 2048;
                
                const source = audioContext.createMediaStreamSource(stream);
                source.connect(analyser);
                
                const bufferLength = analyser.frequencyBinCount;
                const dataArray = new Uint8Array(bufferLength);
                
                // Set up media recorder with proper options
                mediaRecorder = new MediaRecorder(stream, {
                    mimeType: 'audio/webm;codecs=opus'
                });
                
                audioChunks = [];
                
                mediaRecorder.ondataavailable = (event) => {
                    if (event.data.size > 0) {
                        audioChunks.push(event.data);
                    }
                };
                
                mediaRecorder.onstop = async () => {
                    isRecording = false;
                    isProcessing = true;
                    
                    // Update UI
                    recordBtn.disabled = true;
                    recordBtn.classList.remove('active');
                    statusDisplay.textContent = 'Processing audio...';
                    loadingIndicator.style.display = 'block';
                    
                    // Stop visualizer
                    if (animationId) {
                        cancelAnimationFrame(animationId);
                    }
                    
                    // Process audio
                    const audioBlob = new Blob(audioChunks, { type: 'audio/webm' });
                    await processAudio(audioBlob);
                    
                    // Cleanup
                    stream.getTracks().forEach(track => track.stop());
                    if (audioContext) {
                        await audioContext.close();
                    }
                    
                    // Reset state
                    isProcessing = false;
                    recordBtn.disabled = false;
                    drawIdleVisualizer();
                };
                
                // Start recording
                mediaRecorder.start();
                isRecording = true;
                
                // Update UI
                recordBtn.classList.add('active');
                statusDisplay.textContent = 'Listening for music...';
                
                // Start visualizer
                if (animationId) {
                    cancelAnimationFrame(animationId);
                }
                drawLiveVisualizer(analyser, dataArray);
                
                // Auto-stop after 10 seconds
                setTimeout(() => {
                    if (isRecording) stopRecording();
                }, 10000);
                
            } catch (error) {
                console.error('Error starting recording:', error);
                statusDisplay.textContent = 'Error accessing microphone. Please check your permissions.';
                recordBtn.disabled = false;
                recordBtn.classList.remove('active');
                loadingIndicator.style.display = 'none';
                isRecording = false;
                isProcessing = false;
            }
        }

        function stopRecording() {
            if (mediaRecorder && isRecording) {
                mediaRecorder.stop();
                isRecording = false;
            }
        }

        function processAudio(audioBlob) {
            return new Promise((resolve, reject) => {
                const formData = new FormData();
                formData.append('audio', audioBlob, 'recording.wav');
                
                fetch('/recognize', {
                    method: 'POST',
                    body: formData
                })
                .then(response => response.json())
                .then(data => {
                    if (!data.success) {
                        statusDisplay.textContent = data.message || 'Error recognizing song. Please try again.';
                        resolve();
                        return;
                    }
                    
                    recognizedSong = {
                        title: data.songTitle || 'Unknown Title',
                        artist: data.artist || 'Unknown Artist'
                    };
                    
                    // Update UI with recognized song details
                    songTitleElement.textContent = recognizedSong.title;
                    songArtistElement.textContent = recognizedSong.artist;
                    songInfoContainer.style.display = 'block';
                    
                    // Show download button
                    downloadBtn.style.display = 'inline-block';
                    downloadBtn.onclick = () => startDownload(recognizedSong);
                    
                    // Update service links
                    if (data.spotifyUrl) {
                        spotifyLink.href = data.spotifyUrl;
                        spotifyLink.style.display = 'inline-flex';
                    } else {
                        spotifyLink.style.display = 'none';
                    }
                    
                    if (data.youtubeUrl) {
                        youtubeLink.href = data.youtubeUrl;
                        youtubeBtn.style.display = 'inline-block';
                        youtubeLink.style.display = 'inline-flex';
                    } else {
                        youtubeBtn.style.display = 'none';
                        youtubeLink.style.display = 'none';
                    }
                    
                    // Update status
                    statusDisplay.textContent = 'Song recognized successfully!';
                    loadingIndicator.style.display = 'none';
                    recordBtn.disabled = false;
                    resolve();
                })
                .catch(error => {
                    console.error('Error processing audio:', error);
                    statusDisplay.textContent = 'Error recognizing song. Please try again.';
                    loadingIndicator.style.display = 'none';
                    recordBtn.disabled = false;
                    reject();
                });
            });
        }

        function checkDownloadProgress(sessionId) {
            const progressInterval = setInterval(() => {
                fetch(`/download-progress/${sessionId}`)
                .then(response => response.json())
                .then(data => {
                    if (Object.keys(data).length === 0) {
                        clearInterval(progressInterval);
                        return;
                    }
                    
                    const progress = data.progress || 0;
                    const speed = (data.speed || 0) / 1024 / 1024; // Convert to MB/s
                    const eta = data.eta || 0;
                    
                    statusDisplay.textContent = `Downloading: ${progress.toFixed(1)}% (${speed.toFixed(2)} MB/s, ETA: ${eta}s)`;
                })
                .catch(() => clearInterval(progressInterval));
            }, 1000);
        }

        async function downloadSong(songInfo) {
            try {
                const response = await fetch('/download', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        title: songInfo.title,
                        artist: songInfo.artist
                    })
                });
                
                const data = await response.json();
                if (data.success) {
                    const sessionId = data.downloadUrl.split('/')[2];
                    checkDownloadProgress(sessionId);
                    
                    // Create download link
                    const downloadLink = document.createElement('a');
                    downloadLink.href = data.downloadUrl;
                    downloadLink.className = 'service-btn';
                    downloadLink.innerHTML = '<i class="fas fa-download"></i> Download MP3';
                    document.querySelector('.action-buttons').appendChild(downloadLink);
                } else {
                    statusDisplay.textContent = data.message;
                }
            } catch (error) {
                console.error('Error:', error);
                statusDisplay.textContent = 'Error downloading song';
            }
        }

        async function startDownload(songInfo) {
            try {
                statusDisplay.textContent = 'Starting download...';
                const response = await fetch('/download', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        title: songInfo.title,
                        artist: songInfo.artist
                    })
                });

                const data = await response.json();
                if (data.success && data.downloadUrl) {
                    window.location.href = data.downloadUrl;
                    statusDisplay.textContent = 'Download started!';
                } else {
                    statusDisplay.textContent = data.message || 'Download failed. Please try again.';
                }
            } catch (error) {
                console.error('Download error:', error);
                statusDisplay.textContent = 'Error starting download. Please try again.';
            }
        }

        // Add event listeners
        recordBtn.addEventListener('click', async () => {
            if (isRecording) {
                stopRecording();
            } else {
                await startRecording();
            }
        });
    </script>
</body>
</html>
