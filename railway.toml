[build]
builder = "NIXPACKS"
buildCommand = "npm run build"

[deploy]
startCommand = "npm start"
healthcheckPath = "/api/health"
healthcheckTimeout = 100
restartPolicyType = "ON_FAILURE"

[deploy.envs]
NIXPACKS_INSTALL_CMD = "apt-get update && apt-get install -y ffmpeg python3-pip && pip3 install -U yt-dlp"
NODE_ENV = "production"
PORT = "8080"
UPLOAD_DIR = "/tmp/uploads"
DOWNLOAD_DIR = "/tmp/downloads"

[nixpacks]
node_version = "18.x"
enable_cache = true
install_cmd = "npm install"

[[services.ports]]
handlers = ["http"]
port = "8080"

[[services.ports]]
handlers = ["tls", "http"]
port = "443"
