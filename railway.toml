[build]
builder = "NIXPACKS"

[deploy]
startCommand = "python app.py"
healthcheckPath = "/healthz"
healthcheckTimeout = 100
restartPolicyType = "ON_FAILURE"

[deploy.envs]
NIXPACKS_APT_PKGS = "ffmpeg python3-dev build-essential libffi-dev libssl-dev"
RAILWAY_ENVIRONMENT = "production"
FFMPEG_PATH = "/usr/bin/ffmpeg"
FFPROBE_PATH = "/usr/bin/ffprobe"

[nixpacks]
python-version = "3.11"

[[services.ports]]
handlers = ["http"]
port = "80"

[[services.ports]]
handlers = ["tls"]
port = "443"
