[build]
builder = "NIXPACKS"

[deploy]
startCommand = "python app.py"
healthcheckPath = "/"
healthcheckTimeout = 100
restartPolicyType = "ON_FAILURE"

[deploy.envs]
NIXPACKS_APT_PKGS = "ffmpeg"

[nixpacks]
python-version = "3.11"

[[services.ports]]
handlers = ["http"]
port = "80"

[[services.ports]]
handlers = ["tls"]
port = "443"
